<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เติบโต คลินิกเด็กและวัยรุ่น — บันทึกช่องทางลูกค้า</title>
<link rel="icon" type="image/png" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F4F9F7; --surface:#FFFFFF; --teal:#0E9C8B; --teal-deep:#0A6357;
    --teal-faint:#E4F5F2; --amber:#E5177E; --pink-faint:#FDE8F1; --text:#22302E; --muted:#7B8B87;
    --border:#E1EEEA; --rust:#D6553D;
    --yellow:#FFC94A; --purple:#9B7EDE; --sky:#5AAFEE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Prompt',sans-serif; color:var(--text);
    padding:32px 20px 70px;
    background:
      radial-gradient(circle at 8% 10%, rgba(255,201,74,0.18) 0, transparent 45%),
      radial-gradient(circle at 92% 6%, rgba(155,126,222,0.14) 0, transparent 42%),
      radial-gradient(circle at 85% 90%, rgba(90,175,238,0.12) 0, transparent 40%),
      var(--bg);
    background-attachment:fixed;
  }
  .wrap{max-width:1080px; margin:0 auto; display:none;}

  header{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;
    margin-bottom:30px; text-align:left;
  }
  .brand{display:flex; align-items:center; gap:14px;}
  header img{height:128px; width:auto; display:block; filter:drop-shadow(0 6px 14px rgba(14,156,139,0.18));}
  header .subtitle{font-size:13.5px; color:var(--muted); margin:3px 0 0; max-width:420px;}
  h1{font-family:'Prompt',sans-serif; font-weight:600; font-size:22px; margin:0; color:var(--teal-deep); letter-spacing:0.2px;}

  #exportBtn{
    font-family:'Prompt',sans-serif; font-weight:700; font-size:14px; color:#fff;
    background:linear-gradient(135deg, var(--teal), var(--teal-deep));
    border:none; border-radius:999px; padding:12px 26px; cursor:pointer; white-space:nowrap;
    box-shadow:0 6px 16px rgba(10,99,87,0.28);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  #exportBtn:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 10px 20px rgba(10,99,87,0.32); }
  #exportBtn:disabled{background:#DCE7E4; color:var(--muted); cursor:default; box-shadow:none;}

  .grid{display:grid; grid-template-columns:360px 1fr; gap:22px;}
  @media (max-width:800px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:22px;
    box-shadow:0 6px 24px rgba(14,156,139,0.07);
  }
  .form-card{padding:22px 20px 24px;}

  label{display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:6px;}
  input{
    width:100%; height:40px; border:1.5px solid var(--border); border-radius:14px; padding:0 12px;
    font-size:13.5px; font-family:'Prompt',sans-serif; background:#FBFEFD; color:var(--text); outline:none;
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus{ border-color:var(--teal); box-shadow:0 0 0 3px rgba(14,156,139,0.15); }
  .field{margin-bottom:16px;}
  .mono{font-family:'Prompt',sans-serif;}

  .channel-row{display:flex; align-items:center; justify-content:space-between;}
  .link-btn{border:none; background:none; color:var(--teal); font-size:11.5px; font-weight:700; cursor:pointer; padding:0;}

  #channelGrid{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-top:8px;}
  .chip{
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    padding:10px 4px 9px; border-radius:16px; border:1.5px solid var(--border); background:#FBFEFD; cursor:pointer;
    transition:transform 0.12s ease, border-color 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
  }
  .chip:hover{ transform:translateY(-2px); box-shadow:0 6px 14px rgba(14,156,139,0.12); }
  .chip.active{
    border:1.5px solid var(--teal); background:var(--teal-faint);
    box-shadow:0 6px 14px rgba(14,156,139,0.18); transform:translateY(-1px);
  }
  .chip .code{font-family:'Prompt',sans-serif; font-weight:700; font-size:16px;}
  .chip.active .code, .chip.active .lbl{color:var(--teal-deep);}
  .chip .lbl{font-size:10.5px; line-height:1.2; color:var(--muted); text-align:center;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .chip .rm{
    position:absolute; top:-7px; right:-7px; width:19px; height:19px; border-radius:50%;
    background:var(--rust); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(214,85,61,0.4);
  }

  .add-channel-row{display:flex; gap:6px; margin-top:12px;}
  .add-channel-row input{height:36px; font-size:13px; border-radius:12px;}
  .small-btn{
    height:36px; padding:0 14px; border:1.5px solid var(--teal); color:var(--teal); background:#fff;
    border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer; transition:background 0.15s ease;
  }
  .small-btn:hover{ background:var(--teal-faint); }

  #errorMsg{
    color:var(--rust); font-size:12.5px; margin:0 0 12px; display:none;
    background:#FCEBE7; border-radius:10px; padding:8px 10px;
  }
  #saveBtn{
    width:100%; font-family:'Prompt',sans-serif; font-weight:700; font-size:15px; color:#fff;
    background:linear-gradient(135deg, var(--teal), var(--teal-deep));
    border:none; border-radius:16px; padding:13px 0; cursor:pointer;
    box-shadow:0 8px 18px rgba(10,99,87,0.26);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  #saveBtn:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 12px 22px rgba(10,99,87,0.3); }
  #saveBtn:disabled{ opacity:0.6; cursor:default; transform:none; }

  .summary-card{padding:20px 22px; margin-bottom:18px;}
  .summary-card p.title, .list-card p.title{
    margin:0 0 12px; font-size:12.5px; font-weight:700; color:var(--muted); letter-spacing:0.3px;
    text-transform:uppercase;
  }
  .sum-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .sum-code{font-family:'Prompt',sans-serif; font-size:12px; font-weight:700; color:var(--teal-deep); width:20px;}
  .sum-label{font-size:13px; width:130px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-track{flex:1; background:var(--teal-faint); border-radius:999px; height:10px; overflow:hidden;}
  .bar-fill{height:100%; background:linear-gradient(90deg, var(--amber), #FF6FA5); border-radius:999px; transition:width 0.3s ease;}
  .sum-count{font-size:13px; font-weight:700; width:22px; text-align:right; color:var(--teal-deep);}
  .total-row{margin-top:14px; padding-top:12px; border-top:1.5px dashed var(--border); display:flex; justify-content:space-between;}

  .list-card{padding:18px 20px 8px;}
  .list-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
  #searchInput{height:34px; width:190px; font-size:12.5px; border-radius:999px; padding:0 14px;}

  table{width:100%; border-collapse:collapse; font-size:12.8px;}
  thead th{
    text-align:left; font-weight:700; color:var(--teal-deep); font-size:11px; letter-spacing:0.3px;
    text-transform:uppercase; padding:8px 8px; border-bottom:2px solid var(--teal-faint);
    position:sticky; top:0; background:var(--surface);
  }
  tbody tr:hover{ background:#FAFDFC; }
  tbody tr:nth-child(even){ background:#FCFEFD; }
  tbody td{padding:9px 8px; border-bottom:1px solid #F0F5F3;}
  .table-wrap{max-height:420px; overflow-y:auto; margin-bottom:8px; border-radius:14px;}
  .del-btn{
    border:none; background:var(--pink-faint); color:var(--rust); font-size:11.5px; font-weight:700;
    cursor:pointer; padding:5px 10px; border-radius:999px; transition:background 0.12s ease;
  }
  .del-btn:hover:not(:disabled){ background:#FBD9CE; }
  .del-btn:disabled{ opacity:0.5; cursor:default; }

  .empty-msg{font-size:13px; color:var(--muted); padding:24px 0 28px; text-align:center;}
  #statusMsg{font-size:11px; color:var(--muted); text-align:right; margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="logo.png" alt="โลโก้คลินิก" />
      <div>
        <h1>บันทึกช่องทางลูกค้า</h1>
        <p class="subtitle">เก็บเลข CN คู่กับรหัสช่องทางที่ลูกค้าติดต่อเข้ามา แล้วสรุปเป็นไฟล์ Excel</p>
      </div>
    </div>
    <button id="exportBtn" disabled>ดาวน์โหลด Excel (0)</button>
  </header>

  <div class="grid">
    <div class="card form-card">
      <div class="field">
        <label>เลข CN (7 หลัก)</label>
        <input id="cnInput" class="mono" placeholder="เช่น 65 → บันทึกเป็น 0000065" />
        <p id="cnDupHint" style="color:var(--rust); font-size:12px; margin:5px 0 0; display:none;"></p>
      </div>

      <div class="field">
        <div class="channel-row">
          <label style="margin-bottom:0">ช่องทางที่ติดต่อมา</label>
          <button class="link-btn" id="editChannelsBtn">แก้ไขรายการ</button>
        </div>
        <div id="channelGrid"></div>
        <div class="add-channel-row" id="addChannelRow" style="display:none">
          <input id="newChannelInput" placeholder="เพิ่มช่องทางใหม่" />
          <button class="small-btn" id="addChannelBtn">เพิ่ม</button>
        </div>
      </div>

      <div class="field">
        <label>ชื่อคนไข้ (ไม่บังคับ)</label>
        <input id="nameInput" placeholder="ชื่อ-นามสกุล" />
      </div>

      <div class="field">
        <label>วันที่</label>
        <input id="dateInput" type="date" />
      </div>

      <div class="field" style="margin-bottom:16px">
        <label>หมายเหตุ (ไม่บังคับ)</label>
        <input id="noteInput" placeholder="เช่น สอบถามค่าฉีดวัคซีน" />
      </div>

      <p id="errorMsg"></p>
      <button id="saveBtn">บันทึกรายการ</button>
    </div>

    <div>
      <div class="card summary-card">
        <p class="title">สรุปตามช่องทาง</p>
        <div id="summaryList"></div>
        <div class="total-row">
          <span style="font-size:13px; color:var(--muted)">รวมทั้งหมด</span>
          <span id="totalCount" style="font-size:14px; font-weight:600">0 รายการ</span>
        </div>
      </div>

      <div class="card list-card">
        <div class="list-header">
          <p class="title" style="margin:0">รายการล่าสุด</p>
          <input id="searchInput" placeholder="ค้นหา CN / ชื่อ / ช่องทาง" />
        </div>
        <div id="tableArea"></div>
      </div>

      <p id="statusMsg"></p>
    </div>
  </div>
</div>

<script>
// ===== ตั้งค่า =====
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwz2fkJdZrUVtQh-WKVLkswN4hzUot35b4xoYTMYyV6iv4Pu1-HQxo8isu0v6aK1HYpMg/exec";

// ===== state =====
let entries = [];
let channels = [];
let selectedChannel = null;
let editingChannels = false;

const todayStr = () => new Date().toISOString().slice(0, 10);
document.getElementById("dateInput").value = todayStr();

function formatCN(raw) {
  const t = raw.trim();
  if (!t) return "";
  if (/^\d+$/.test(t)) return t.slice(-7).padStart(7, "0");
  return t;
}

function formatThaiDate(raw) {
  if (!raw) return "-";
  const s = String(raw);
  const d = s.includes("T") ? new Date(s) : new Date(s + "T00:00:00");
  if (isNaN(d.getTime())) return "-";
  return d.toLocaleDateString("th-TH", { year: "numeric", month: "short", day: "numeric" });
}

// ===== API =====
async function fetchEntries() {
  const res = await fetch(APPS_SCRIPT_URL + "?t=" + Date.now(), {
    method: "GET",
    cache: "no-store",
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "โหลดข้อมูลไม่สำเร็จ");
  const parsedEntries = data.entries
    .map((row) => ({
      id: row.rowIndex,
      cn: String(row.cn),
      channelCode: Number(row.channelCode),
      channelLabel: row.channelLabel,
      name: row.name,
      date: row.date,
      note: row.note,
    }))
    .reverse();
  const parsedChannels = (data.channels || []).map((c) => ({ code: Number(c.code), label: String(c.label) }));
  return { entries: parsedEntries, channels: parsedChannels };
}

async function postEntry(entry) {
  const params = new URLSearchParams();
  Object.entries(entry).forEach(([k, v]) => params.append(k, v));
  const res = await fetch(APPS_SCRIPT_URL, { method: "POST", body: params });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch (e) { data = { ok: false, error: text.slice(0, 200) }; }
  if (!data.ok) throw new Error(data.error || "บันทึกไม่สำเร็จ");
}

async function deleteEntryRemote(rowIndex) {
  const params = new URLSearchParams();
  params.append("action", "delete");
  params.append("id", rowIndex);
  const res = await fetch(APPS_SCRIPT_URL, { method: "POST", body: params });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch (e) { data = { ok: false, error: text.slice(0, 200) }; }
  if (!data.ok) throw new Error(data.error || "ลบไม่สำเร็จ");
}

async function addChannelRemote(label) {
  const params = new URLSearchParams();
  params.append("action", "addChannel");
  params.append("label", label);
  const res = await fetch(APPS_SCRIPT_URL, { method: "POST", body: params });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch (e) { data = { ok: false, error: text.slice(0, 200) }; }
  if (!data.ok) throw new Error(data.message || data.error || "เพิ่มช่องทางไม่สำเร็จ");
  return (data.channels || []).map((c) => ({ code: Number(c.code), label: String(c.label) }));
}

async function deleteChannelRemote(code) {
  const params = new URLSearchParams();
  params.append("action", "deleteChannel");
  params.append("code", code);
  const res = await fetch(APPS_SCRIPT_URL, { method: "POST", body: params });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch (e) { data = { ok: false, error: text.slice(0, 200) }; }
  if (!data.ok) throw new Error(data.message || data.error || "ลบช่องทางไม่สำเร็จ");
  return (data.channels || []).map((c) => ({ code: Number(c.code), label: String(c.label) }));
}

async function refreshEntries() {
  setStatus("saving");
  try {
    const result = await fetchEntries();
    entries = result.entries;
    channels = result.channels;
    setStatus("saved");
  } catch (err) {
    setStatus("error");
  }
  render();
}

function setStatus(state) {
  const el = document.getElementById("statusMsg");
  el.textContent = state === "saving" ? "กำลังซิงก์กับ Google Sheet…"
    : state === "saved" ? "ข้อมูลตรงกับ Google Sheet แล้ว"
    : state === "error" ? "เชื่อมต่อ Google Sheet ไม่สำเร็จ" : "";
}

// ===== render =====
function renderChannels() {
  const grid = document.getElementById("channelGrid");
  grid.innerHTML = "";
  channels.forEach((c) => {
    const chip = document.createElement("div");
    chip.className = "chip" + (selectedChannel === c.code ? " active" : "");
    chip.title = c.label;
    chip.innerHTML = `<span class="code">${String(c.code).padStart(2,"0")}</span><span class="lbl">${escapeHtml(c.label)}</span>` +
      (editingChannels ? `<span class="rm" data-code="${c.code}">×</span>` : "");
    chip.addEventListener("click", (e) => {
      if (e.target.classList.contains("rm")) return;
      selectedChannel = c.code;
      renderChannels();
    });
    const rm = chip.querySelector(".rm");
    if (rm) {
      rm.addEventListener("click", async (e) => {
        e.stopPropagation();
        const inUse = entries.some((en) => en.channelCode === c.code);
        if (inUse) {
          alert("ช่องทางนี้มีข้อมูลลูกค้าผูกอยู่แล้ว ลบไม่ได้");
          return;
        }
        rm.style.pointerEvents = "none";
        try {
          channels = await deleteChannelRemote(c.code);
        } catch (err) {
          alert(err.message);
        }
        renderChannels();
        renderSummary();
      });
    }
    grid.appendChild(chip);
  });
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function renderSummary() {
  const counts = channels.map((c) => ({ ...c, count: entries.filter((e) => e.channelCode === c.code).length }));
  const maxCount = Math.max(1, ...counts.map((c) => c.count));
  const sorted = counts.slice().sort((a, b) => b.count - a.count);
  const list = document.getElementById("summaryList");
  list.innerHTML = sorted.map((c) => `
    <div class="sum-row">
      <span class="sum-code">${String(c.code).padStart(2,"0")}</span>
      <span class="sum-label">${escapeHtml(c.label)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${(c.count/maxCount)*100}%; background:${c.count>0?'var(--amber)':'transparent'}"></div></div>
      <span class="sum-count">${c.count}</span>
    </div>
  `).join("");
  document.getElementById("totalCount").textContent = entries.length + " รายการ";
  document.getElementById("exportBtn").disabled = entries.length === 0;
  document.getElementById("exportBtn").textContent = `ดาวน์โหลด Excel (${entries.length})`;
}

let deleteQueue = Promise.resolve();

function renderTable() {
  const search = document.getElementById("searchInput").value.trim().toLowerCase();
  const filtered = entries.filter((e) => {
    if (!search) return true;
    return e.cn.toLowerCase().includes(search) || (e.name && e.name.toLowerCase().includes(search)) || e.channelLabel.toLowerCase().includes(search);
  });
  const area = document.getElementById("tableArea");
  if (filtered.length === 0) {
    area.innerHTML = `<p class="empty-msg">ยังไม่มีรายการ — เริ่มบันทึกจากฟอร์มด้านซ้าย</p>`;
    return;
  }
  area.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>CN</th><th>รหัส</th><th>ช่องทาง</th><th>ชื่อ</th><th>วันที่</th><th></th></tr></thead>
        <tbody>
          ${filtered.map((e) => `
            <tr>
              <td class="mono">${escapeHtml(e.cn)}</td>
              <td class="mono" style="color:var(--teal-deep); font-weight:600">${String(e.channelCode).padStart(2,"0")}</td>
              <td>${escapeHtml(e.channelLabel)}</td>
              <td>${escapeHtml(e.name || "-")}</td>
              <td style="white-space:nowrap">${formatThaiDate(e.date)}</td>
              <td style="text-align:right"><button class="del-btn" data-id="${e.id}">ลบ</button></td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
  area.querySelectorAll(".del-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (btn.disabled) return;
      const id = btn.dataset.id;
      if (String(id).startsWith("temp-")) return; // ยังไม่ซิงก์กับชีทจริง รอสักครู่ก่อนกดลบ
      btn.disabled = true;
      const removedRow = Number(id);
      const snapshot = entries; // เก็บสำรองไว้เผื่อลบไม่สำเร็จ

      // ลบออกจากจอทันที + เลื่อนเลขแถวของรายการที่เหลือเอง ไม่ต้องขอข้อมูลใหม่ทั้งหมด
      entries = entries
        .filter((e) => e.id !== removedRow)
        .map((e) => (e.id > removedRow ? { ...e, id: e.id - 1 } : e));
      render();
      setStatus("saving");

      // เข้าคิว ส่งคำขอลบไปที่ Google ทีละอันตามลำดับที่กด ห้ามแซงคิวกันเด็ดขาด
      deleteQueue = deleteQueue.then(async () => {
        try {
          await deleteEntryRemote(id);
          setStatus("saved");
        } catch (err) {
          entries = snapshot; // คืนค่าเดิมแล้วขอข้อมูลจริงจากชีทใหม่เพื่อความชัวร์
          render();
          setStatus("error");
          await refreshEntries();
        }
      });
    });
  });
}

function render() {
  renderChannels();
  renderSummary();
  renderTable();
}

// ===== events =====
document.getElementById("editChannelsBtn").addEventListener("click", () => {
  editingChannels = !editingChannels;
  document.getElementById("editChannelsBtn").textContent = editingChannels ? "เสร็จแล้ว" : "แก้ไขรายการ";
  document.getElementById("addChannelRow").style.display = editingChannels ? "flex" : "none";
  renderChannels();
});

document.getElementById("addChannelBtn").addEventListener("click", async () => {
  const input = document.getElementById("newChannelInput");
  const btn = document.getElementById("addChannelBtn");
  const label = input.value.trim();
  if (!label) return;
  btn.disabled = true;
  try {
    channels = await addChannelRemote(label);
    input.value = "";
  } catch (err) {
    alert(err.message);
  }
  btn.disabled = false;
  renderChannels();
  renderSummary();
});
document.getElementById("newChannelInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("addChannelBtn").click();
});

document.getElementById("cnInput").addEventListener("blur", (e) => {
  if (e.target.value.trim()) e.target.value = formatCN(e.target.value);
});

document.getElementById("cnInput").addEventListener("input", (e) => {
  const hint = document.getElementById("cnDupHint");
  const raw = e.target.value.trim();
  if (!raw) {
    hint.style.display = "none";
    return;
  }
  const candidate = formatCN(raw);
  const dup = entries.find((en) => en.cn === candidate);
  if (dup) {
    hint.textContent = `⚠ เลข CN ${candidate} มีอยู่แล้ว (${dup.channelLabel}, ${formatThaiDate(dup.date)})`;
    hint.style.display = "block";
  } else {
    hint.style.display = "none";
  }
});

document.getElementById("searchInput").addEventListener("input", renderTable);

document.getElementById("saveBtn").addEventListener("click", async () => {
  const saveBtn = document.getElementById("saveBtn");
  if (saveBtn.disabled) return;
  const cn = document.getElementById("cnInput").value;
  const errEl = document.getElementById("errorMsg");
  errEl.style.display = "none";

  if (!cn.trim()) {
    errEl.textContent = "กรอกเลข CN ก่อน";
    errEl.style.display = "block";
    return;
  }
  if (!selectedChannel) {
    errEl.textContent = "เลือกช่องทางที่ติดต่อมา";
    errEl.style.display = "block";
    return;
  }

  const formattedCn = formatCN(cn);
  const dup = entries.find((e) => e.cn === formattedCn);
  if (dup) {
    errEl.textContent = `เลข CN ${formattedCn} มีอยู่แล้วในระบบ (ช่องทาง: ${dup.channelLabel}, วันที่: ${formatThaiDate(dup.date)})`;
    errEl.style.display = "block";
    return;
  }

  const ch = channels.find((c) => c.code === selectedChannel);
  const newEntry = {
    cn: formattedCn,
    channelCode: selectedChannel,
    channelLabel: ch ? ch.label : "",
    name: document.getElementById("nameInput").value.trim(),
    date: document.getElementById("dateInput").value,
    note: document.getElementById("noteInput").value.trim(),
  };

  saveBtn.disabled = true;

  // แสดงผลทันทีก่อน ไม่ต้องรอ Google Sheet ตอบกลับ
  const tempId = "temp-" + Date.now();
  entries.unshift({ ...newEntry, id: tempId });
  render();
  document.getElementById("cnInput").value = "";
  document.getElementById("nameInput").value = "";
  document.getElementById("noteInput").value = "";
  document.getElementById("cnDupHint").style.display = "none";

  setStatus("saving");
  try {
    await postEntry(newEntry);
    await refreshEntries(); // ดึงข้อมูลจริงจากชีทมาแทนที่ของชั่วคราว (rowIndex ที่แท้จริง)
  } catch (err) {
    entries = entries.filter((e) => e.id !== tempId);
    render();
    errEl.textContent = err.message === "duplicate_cn"
      ? `เลข CN ${formattedCn} มีอยู่แล้วในระบบ (Google Sheet ปฏิเสธเพราะซ้ำ)`
      : "บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง";
    errEl.style.display = "block";
    setStatus("error");
  } finally {
    saveBtn.disabled = false;
  }
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const listRows = entries.slice().sort((a, b) => (a.date < b.date ? 1 : -1)).map((e) => ({
    "เลข CN": e.cn, "รหัสช่องทาง": e.channelCode, "ชื่อช่องทาง": e.channelLabel,
    "ชื่อคนไข้": e.name || "", "วันที่": e.date, "หมายเหตุ": e.note || "",
  }));
  const summary = channels.map((c) => ({
    "รหัส": c.code, "ช่องทาง": c.label, "จำนวน": entries.filter((e) => e.channelCode === c.code).length,
  })).sort((a, b) => b["จำนวน"] - a["จำนวน"]);
  summary.push({ "รหัส": "", "ช่องทาง": "รวมทั้งหมด", "จำนวน": entries.length });

  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.json_to_sheet(listRows);
  ws1["!cols"] = [{wch:10},{wch:10},{wch:20},{wch:18},{wch:12},{wch:24}];
  XLSX.utils.book_append_sheet(wb, ws1, "รายการลูกค้า");
  const ws2 = XLSX.utils.json_to_sheet(summary);
  ws2["!cols"] = [{wch:8},{wch:22},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws2, "สรุปช่องทาง");
  XLSX.writeFile(wb, `customer-source_${todayStr()}.xlsx`);
});

// ===== init + password gate =====
const ACCESS_PASSWORD = "foolman";

function openApp() {
  document.getElementById("passwordGate")?.remove();
  document.querySelector(".wrap").style.display = "block";
  render();
  refreshEntries();
}

if (sessionStorage.getItem("clinic_authenticated") === "yes") {
  openApp();
} else {
  document.body.insertAdjacentHTML("afterbegin", `
    <div id="passwordGate" style="max-width:360px;margin:90px auto;padding:24px;text-align:center;font-family:'Prompt',sans-serif">
      <img src="logo.png" alt="โลโก้คลินิก" style="width:160px;height:auto;display:block;margin:0 auto 16px;filter:drop-shadow(0 6px 14px rgba(14,156,139,0.18))">
      <h2 style="font-family:'Prompt',sans-serif;font-weight:600;color:#0A6357;margin:0 0 8px">สำหรับเจ้าหน้าที่</h2>
      <p style="color:#7B8B87;margin:0 0 14px">กรุณาใส่รหัสผ่าน</p>
      <input id="passwordInput" type="password" placeholder="รหัสผ่าน"
        style="width:100%;height:44px;padding:0 12px;border:1.5px solid #E1EEEA;border-radius:12px;font-size:15px;font-family:'Prompt',sans-serif">
      <p id="passwordError" style="display:none;color:#D6553D;font-size:13px;margin:8px 0 0">รหัสผ่านไม่ถูกต้อง</p>
      <button id="passwordBtn" style="width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;background:#0E9C8B;color:white;font-family:'Prompt',sans-serif;font-size:15px;font-weight:700;cursor:pointer">เข้าสู่ระบบ</button>
    </div>
  `);

  function checkPassword() {
    if (document.getElementById("passwordInput").value === ACCESS_PASSWORD) {
      sessionStorage.setItem("clinic_authenticated", "yes");
      openApp();
    } else {
      document.getElementById("passwordError").style.display = "block";
    }
  }

  document.getElementById("passwordBtn").onclick = checkPassword;
  document.getElementById("passwordInput").onkeydown = (e) => {
    if (e.key === "Enter") checkPassword();
  };
}
</script>
